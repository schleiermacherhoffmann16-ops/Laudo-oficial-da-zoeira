<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laudo Oficial de Zoeira</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9e4d4;--paper:#fffdf5;--ink:#1d1b16;--muted:#6b665a;--stamp:#c8102e;--accent:#0f6e6e;--line:#cfc8b2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--paper:#26241a;--ink:#f3efdf;--muted:#a49f8c;--stamp:#ff5a6e;--accent:#5fd0cc;--line:#4a4636}}
:root[data-theme="dark"]{--bg:#17160f;--paper:#26241a;--ink:#f3efdf;--muted:#a49f8c;--stamp:#ff5a6e;--accent:#5fd0cc;--line:#4a4636}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Courier New",Courier,monospace;min-height:100vh;display:flex;justify-content:center;padding:20px 14px 40px}
.sheet{background:var(--paper);width:100%;max-width:440px;border:2px solid var(--ink);padding:22px 18px;position:relative;box-shadow:6px 6px 0 var(--ink);align-self:flex-start}
h1{font-size:19px;line-height:1.25;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;font-weight:bold;margin-bottom:6px;font-size:14px}
input{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:bold;font-size:16px;width:100%;margin-top:12px;padding:14px;background:var(--ink);color:var(--paper);border:0;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.hide{display:none}
.bar{height:16px;border:2px solid var(--ink);margin:14px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s linear}
#step{font-size:14px;min-height:2.6em}
.dx{font-size:20px;line-height:1.3;font-weight:bold;margin:6px 0 16px;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row b{color:var(--accent);white-space:nowrap}
.rx{margin-top:16px;font-size:14px;line-height:1.45}
.stamp{position:absolute;right:10px;top:70px;transform:rotate(14deg);border:3px solid var(--stamp);color:var(--stamp);font-weight:bold;font-size:13px;padding:4px 8px;text-align:center;line-height:1.15;background:var(--paper);opacity:.95}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="sheet">
  <h1>Conselho Federal de Zoeira<br>Laudo Oficial</h1>
  <p class="sub">Scanner de personalidade 3000</p>

  <div id="s1">
    <label for="nome">Qual é o seu nome ou @?</label>
    <input id="nome" type="text" maxlength="30" autocomplete="off" placeholder="digite aqui">
    <button id="go" type="button">Escanear minha vida</button>
  </div>

  <div id="s2" class="hide">
    <div class="bar"><i id="fill"></i></div>
    <div id="step"></div>
  </div>

  <div id="s3" class="hide">
    <div class="stamp">APROVADO<br>PELA ZOEIRA</div>
    <div id="who" style="font-size:14px;color:var(--muted)"></div>
    <div class="dx" id="dx"></div>
    <div id="stats"></div>
    <div class="rx" id="rx"></div>
    <button id="again" type="button" class="alt">Escanear outra pessoa</button>
    <button id="share" type="button">Mandar pro amigo ver o dele</button>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var steps=[
    'Conectando ao satélite da fofoca...',
    'Lendo seus stories antigos... meu Deus.',
    'Consultando a sua mãe. Ela mandou um áudio de 4 minutos.',
    'Contando quantas vezes você disse "já tô indo" ainda em casa...',
    'Analisando seu histórico de delivery... sem comentários.',
    'Gerando laudo e imprimindo carimbo...'
  ];
  var dx=[
    'Detetive de story: vê tudo, curte nada e finge que não viu.',
    'Gambá de academia: aparece em janeiro, some em fevereiro.',
    'Mestre do "vou dormir cedo hoje" às 3h da manhã.',
    'Dono de 47 abas abertas e nenhuma útil.',
    'Ator de áudio de 4 minutos que podia ser "sim".',
    'Especialista em abrir a geladeira esperando comida nova.',
    'Pessoa do "chego em 5 min" que ainda está no banho.',
    'Colecionador de print de conversa pra usar como prova.',
    'Campeão de dizer "depois eu respondo" e esquecer pra sempre.',
    'Profissional de rir sozinho olhando pro celular.'
  ];
  var stats=[
    'Chance de pedir comida hoje',
    'Nível de preguiça de responder mensagem',
    'Chance de ver story e não reagir',
    'Chance de chorar em propaganda de banco',
    'Chance de dizer "vou começar segunda"',
    'Chance de olhar o celular enquanto lê isto'
  ];
  var rx=[
    'Beba água e pare de mandar áudio de 4 minutos.',
    'Receita: 1 soneca, 2 memes e zero resposta no grupo da família.',
    'Evite dizer "chego em 5 min" antes de entrar no banho.',
    'Repouso absoluto e proibido abrir o delivery até amanhã.',
    'Tratamento: ir dormir antes das 3h. Se persistir, o paciente é você mesmo.',
    'Uso contínuo de "visualizou e não respondeu" é contraindicado.'
  ];
  function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function show(id){['s1','s2','s3'].forEach(function(x){$(x).classList.toggle('hide',x!==id)})}
  function scan(){
    var n=$('nome').value.trim();
    if(!n){$('nome').focus();return}
    show('s2');$('fill').style.width='0';
    var i=0;$('step').textContent=steps[0];
    setTimeout(function(){$('fill').style.width='100%'},30);
    $('fill').style.transitionDuration=(steps.length*0.9)+'s';
    var t=setInterval(function(){
      i++;
      if(i>=steps.length){clearInterval(t);result(n);return}
      $('step').textContent=steps[i];
    },900);
  }
  function result(n){
    var r=rng(hash(n.toLowerCase()));
    $('who').textContent='Paciente: '+n;
    $('dx').textContent='Diagnóstico: '+dx[Math.floor(r()*dx.length)];
    var html='';
    stats.forEach(function(s){
      var v=Math.floor(r()*100);
      if(s.indexOf('celular enquanto')>-1)v=100;
      html+='<div class="row"><span>'+s+'</span><b>'+v+'%</b></div>';
    });
    $('stats').innerHTML=html;
    $('rx').textContent='Receita médica: '+rx[Math.floor(r()*rx.length)];
    show('s3');
  }
  $('go').addEventListener('click',scan);
  $('nome').addEventListener('keydown',function(e){if(e.key==='Enter')scan()});
  $('again').addEventListener('click',function(){$('nome').value='';show('s1');$('nome').focus()});
  $('share').addEventListener('click',function(){
    var d={title:'Laudo Oficial de Zoeira',text:'Fiz o laudo da zoeira e o resultado foi insano. Faz o seu:',url:location.href};
    try{if(navigator.share){navigator.share(d);return}}catch(e){}
    try{navigator.clipboard.writeText(location.href);$('share').textContent='Link copiado!'}catch(e){}
  });
})();
</script>
</body>
</html>
